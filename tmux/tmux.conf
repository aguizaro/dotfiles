#------- COLOR PARAMETERS ----------------------------------------------

# Colors used while a pane is in copy mode
set -g @copy_mode_border_color colour130 # orange (border color for active panes in copy mode)
set -g @copy_mode_highlight_text_color colour231 # white (white for text in copy mode)
set -g @copy_mode_highlight_bg_color colour130 # orange (darker orange for background in copy mode)
set -g @copy_mode_highlight_all_matches_text_color colour215 # light orange (non-current search matches)

# Status bar: session name box (left side)
set -g @session_name_background_color colour237 # dark gray (session name background)
set -g @session_name_foreground_color colour141 # lavender (session name text color)
set -g @session_name_prefix_foreground_color colour231 # white (prefix indicator)
set -g @session_name_prefix_background_color colour34 # green (prefix indicator backrgound color)

# Status bar: general accent colors (windows list, message text, etc.)
set -g @accent_color colour141 # lavender (active window and active pane indicator)
set -g @accent_foreground_color colour231 # white (text on status bar)
set -g @accent_background_color colour237 # dark gray (status bar background)
set -g @accent_secondary_background_color colour239 # medium gray (inactive window background)

# Color of tmux's own command-line messages/prompts
set -g message-style "bg=#{@accent_background_color},fg=#{@accent_foreground_color}"
# Change from tmux-256color to more universal xterm-256color
set -g default-terminal "xterm-256color"

#------- PREFIX ----------------------------------------------------------

# Use Ctrl-a as the prefix key
unbind C-b
set -g prefix C-a
# Press prefix twice to send a literal Ctrl-a through to the shell
bind C-a send-prefix

#------- BASICS ----------------------------------------------------------

set -g mouse on # Enable mouse support
setw -g mode-keys vi # Use vi-style keys for navigating/selecting in copy mode
set -g base-index 1 # Start window numbering at 1
set -g pane-base-index 1 # Start pane numbering at 1 too
set -g renumber-windows on # Keep window numbers sequential

#------- WINDOWS ----------------------------------------------------------

# Open new windows right after the current one
bind c new-window -a
# Shift+Left/Right - switch windows directly w/o prefix
bind -n S-Left previous-window
bind -n S-Right next-window
# Don't let tmux auto-rename windows based on the running command
set -g automatic-rename off
# Ignore rename requests sent by programs via escape sequences
set -g allow-rename off
# prefix + , prompts for a new window name
bind , command-prompt -p "(rename window)" "rename-window -- '%%'"

#------- PANES ----------------------------------------------------------

# Remove the default split bindings
unbind '"'
unbind %
# | splits side-by-side, - splits stacked - both open in the current pane's
# working directory instead of the session's original directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# Close a pane immediately when its process exits
set -g remain-on-exit off

# Keep a large scrollback buffer per pane
set -g history-limit 200000
# Show a title bar at the top of each pane
set -g pane-border-status top

#------- COPY / SCROLL --------------------------------------------------

# Mouse-drag select copies to the clipboard on release and stays in copy mode
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection
# Copy mode with vi-style keys and stay in copy mode
bind -T copy-mode-vi Enter send -X copy-selection
# prefix + s enters copy mode and immediately opens a backward search prompt
bind s copy-mode \; send-keys '?'

# Make copy mode more obvious with a different color scheme
# Color of the active text selection while in copy mode
set -g mode-style "fg=#{@copy_mode_highlight_text_color},bg=#{@copy_mode_highlight_bg_color}"
# Color of search matches that aren't the current one
set -g copy-mode-match-style "fg=#{@copy_mode_highlight_all_matches_text_color},bg=default"
# Color of the current/active search match
set -g copy-mode-current-match-style "bg=#{@copy_mode_highlight_bg_color},fg=#{@copy_mode_highlight_text_color}"
# Override / and ? in copy mode to use a visible command-prompt for the search query
bind -T copy-mode-vi / command-prompt -i -p "(search down)" "send-keys -X search-forward-incremental \"%%%\""
bind -T copy-mode-vi ? command-prompt -i -p "(search up)" "send-keys -X search-backward-incremental \"%%%\""

# Inactive pane border: switch to the copy-mode color while the pane is in copy mode, otherwise use the normal accent color
set -g pane-border-style "#{?pane_in_mode,fg=#{@copy_mode_border_color},fg=#{@accent_foreground_color}}"
# Active pane border: same idea
set -g pane-active-border-style "#{?pane_in_mode,fg=#{@copy_mode_border_color},fg=#{@accent_color}}"
# Pane border title: show a "COPY" label plus pane index/title while in copy mode
set -g pane-border-format "#{?pane_in_mode,#[fg=#{@copy_mode_border_color},bold] COPY #[default],}#{pane_index} #{pane_title}"

#------- STATUS BAR --------------------------------------------------------

set -g status on
# Refresh the status bar/clock every 5 seconds
set -g status-interval 5
set -g status-style "bg=#{@accent_background_color},fg=#{@accent_foreground_color}"
# Max width reserved for the left/right status bar segments
set -g status-left-length 30
set -g status-right-length 150

# Left: session name, highlighted with the prefix colors while the prefix key is pressed
set -g status-left "\
#[fg=#{?client_prefix,#{@session_name_prefix_foreground_color},#{@session_name_foreground_color}}]\
#[bg=#{?client_prefix,#{@session_name_prefix_background_color},#{@session_name_background_color}}]\
 ❐ #S "

# Right: date/time with visual separators
set -g status-right "\
#[fg=#{@accent_foreground_color},bg=#{@accent_background_color}]  %b %d %y\
#[fg=#{@accent_foreground_color}]  %I:%M %p \
#[fg=#{@accent_foreground_color},bg=#{@accent_background_color}]"

# Inactive windows, with visual separators and current window index/name displayed
set-window-option -g window-status-format "\
#[fg=#{@accent_background_color},bg=#{@accent_secondary_background_color},noitalics]\
#[fg=#{@accent_foreground_color},bg=#{@accent_secondary_background_color}] #I \
#[fg=#{@accent_foreground_color},bg=#{@accent_secondary_background_color}] #W \
#[fg=#{@accent_secondary_background_color},bg=#{@accent_background_color}]"

# Active window
set-window-option -g window-status-current-format "\
#[fg=#{@accent_background_color},bg=#{@accent_color}]\
#[fg=#{@accent_background_color},bg=#{@accent_color}] #I \
#[fg=#{@accent_background_color},bg=#{@accent_color},bold] #W \
#[fg=#{@accent_color},bg=#{@accent_background_color}]"

# Activity alert: style applied to a window's tab when it has unseen output
set-window-option -g window-status-activity-style "bg=#{@accent_background_color},fg=colour248"
# Bell alert: style applied when a pane receives a terminal bell character
set-window-option -g window-status-bell-style "bg=#{@session_name_prefix_background_color},fg=colour235"
